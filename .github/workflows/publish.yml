name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.0"
        required: true
        type: string


# Only one publish attempt for a given release tag may run at a time.
# A manually dispatched recovery run waits for an automatic release run.
concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag format
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"

          echo "Tag:     $TAG"
          echo "Version: $VERSION"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag does not match pyproject.toml version"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Recovery/manual runs are idempotent if files already exist.
          skip-existing: true
