name: Execution research

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check lob tests tools legacy/evaluate.py train_rl.py server.py
      - run: python -m compileall -q lob legacy/evaluate.py train_rl.py server.py
      - run: python -m pytest -q

      # Run repository checks on both Python versions.
      - run: cleo config validate configs/research.yaml
      - run: cleo validate-data examples/data/canonical-events.jsonl
      - run: cleo benchmark --pairs 500 --repeats 1

  research-study:
    runs-on: ubuntu-latest
    needs: correctness

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -e '.[dev,rl]'

      - name: Register PPO study
        shell: bash
        run: |
          study="examples/studies/core/ppo-final-${{ github.run_id }}"
          python train_rl.py register \
            --config configs/core-study.json \
            --out "$study"

      - name: Train PPO study
        shell: bash
        run: |
          study="examples/studies/core/ppo-final-${{ github.run_id }}"
          python train_rl.py train --study "$study"

      - name: Evaluate PPO study
        shell: bash
        run: |
          study="examples/studies/core/ppo-final-${{ github.run_id }}"
          python train_rl.py evaluate --study "$study"

      - name: Verify PPO study
        shell: bash
        run: |
          study="examples/studies/core/ppo-final-${{ github.run_id }}"
          python train_rl.py verify --study "$study"

  ppo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,rl]'
      - run: python -m pytest -q tests/test_core_study.py