name: Execution research

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_study:
        description: 'Reproduce the frozen 20-model study and upload its evidence'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check lob tests tools train_rl.py server.py
      - run: python -m compileall -q lob tools train_rl.py server.py
      - run: python -m pytest -q      

      # Run repository checks on both Python versions.
      - run: cleo config validate configs/research.yaml
      - run: cleo validate-data examples/data/canonical-events.jsonl
      - run: cleo benchmark --pairs 500 --repeats 1

  research-study:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_study == true
    runs-on: ubuntu-latest
    needs: [correctness, ppo-contract]
    timeout-minutes: 180
    env:
      STUDY_ROOT: results/research-ci/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Prepare retained evidence directory
        run: mkdir -p "$STUDY_ROOT/logs"

      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,rl,plots]'

      - name: Register PPO study
        shell: bash
        run: |
          python train_rl.py register \
            --config configs/core-study.json \
            --out "$STUDY_ROOT/study" 2>&1 | tee "$STUDY_ROOT/logs/registration.log"

      - name: Train PPO study
        shell: bash
        run: |
          python train_rl.py train --study "$STUDY_ROOT/study" --workers 4 \
            2>&1 | tee "$STUDY_ROOT/logs/training.log"

      - name: Evaluate PPO study
        shell: bash
        run: |
          python train_rl.py evaluate --study "$STUDY_ROOT/study" \
            2>&1 | tee "$STUDY_ROOT/logs/evaluation.log"

      - name: Verify PPO study
        shell: bash
        run: |
          python train_rl.py verify --study "$STUDY_ROOT/study" \
            2>&1 | tee "$STUDY_ROOT/logs/verification.log"

      - name: Generate Plotly reports
        shell: bash
        run: |
          python tools/report_core_study.py "$STUDY_ROOT/study" \
            --out "$STUDY_ROOT/reports" 2>&1 | tee "$STUDY_ROOT/logs/reports.log"

      - name: Retain completed or failed research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STUDY_ROOT }}/
          if-no-files-found: warn
          retention-days: 90

  ppo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,rl]'
      - run: python -m pytest -q tests/test_core_study.py
